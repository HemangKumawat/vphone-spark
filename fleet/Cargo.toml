# The host-side control plane for many phones on one host (docs/DENSITY.md). Linux only.
# Build for a DGX Spark from any host: cargo spark (see .cargo/config.toml).
[workspace]
members = ["vphone-api-proxy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libc = "0.2.170"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Lints from BeautifulRust (MIT, github.com/morganlinton/BeautifulRust lints/lints.toml), minus
# the library-only ones (missing_docs, missing_errors_doc, missing_panics_doc, print_stdout,
# print_stderr): these crates are binaries.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
